<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 240px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; color: #1f2023; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  input { width: 16px; height: 16px; accent-color: #5e6ad2; margin: 0; }
  button { margin-top: 10px; padding: 0; border: 0; background: none; color: #6b6f76; font: inherit; font-size: 11px; text-decoration: underline; cursor: pointer; }
  #status { margin-top: 4px; font-size: 11px; color: #6b6f76; min-height: 14px; }
  @media (prefers-color-scheme: dark) { body { background: #1f2023; color: #eee; } button, #status { color: #a0a3a9; } }
</style>
</head>
<body>
  <label>Show assignee filter <input id="toggle" type="checkbox"></label>
  <button id="debug">Copy debug report</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
